# Managed by ubuntu-mirror-server — DP Upgrade Mirror Manager HTTP site
#
# Canonical document root (single final selective tree; no generation symlinks):
#   /var/spool/apt-mirror/selective
#
# Path-based serving (no external DNS required):
#   /ubuntu/          → selective hop tree (materialized by Mirror Manager)
#   /ubuntu-security/ → same selective tree (no duplicate pool storage)
#   /offline/         → selective shared offline metadata
#   /hops/<hop>/ubuntu/ → hop-separated snapshots
#   /client/          → DP offline upgrade client scripts
#   /dp-phase2/<ver>/ → single final Phase 2 artifact set
#
# IMPORTANT: Never expose staging or .install-cache over HTTP.
# Bootstrap install.sh and Enable HTTP Distribution deploy this template.
# Generation symlink paths are not used.
#
# Optional Host compatibility (same listen port; enable via /etc/hosts if desired):
#   Host: archive.ubuntu.com / security.ubuntu.com / old-releases.ubuntu.com

# Default path-based vhost (clients use http://MIRROR_IP/ubuntu and /ubuntu-security)
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Single selective tree (staging never exposed)
    root /var/spool/apt-mirror/selective;
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hop-separated snapshots
    location /hops/ {
        alias /var/spool/apt-mirror/selective/hops/;
        autoindex on;
    }

    # Trailing-slash-safe alias — rewrite to hop path via client sources,
    # or serve a default hop symlink at published/ubuntu when present.
    location = /ubuntu {
        return 301 /ubuntu/;
    }
    location /ubuntu/ {
        alias /var/spool/apt-mirror/selective/ubuntu/;
        autoindex on;
    }

    # Security pocket compatibility prefix (same selective tree; no file duplication)
    location = /ubuntu-security {
        return 301 /ubuntu-security/;
    }
    location /ubuntu-security/ {
        alias /var/spool/apt-mirror/selective/ubuntu/;
        autoindex on;
    }

    # Offline upgrade metadata (meta-release-lts, READY) from selective shared/
    location = /offline {
        return 301 /offline/;
    }
    location /offline/ {
        alias /var/spool/apt-mirror/selective/shared/offline/;
        autoindex off;
        default_type text/plain;
        types {
            application/json json;
            text/plain txt;
            text/plain READY FROZEN;
        }
    }

    # Local selective signing key (public)
    location = /keys/ubuntu-mirror-selective.gpg {
        alias /var/spool/apt-mirror/selective/keys/ubuntu-mirror-selective.gpg;
        default_type application/pgp-keys;
    }

    # Client upgrade artifacts (separate from selective published repository).
    # Populated by: ubuntu-offline-mirror.sh build-client-xenial-to-bionic
    # Must NOT live under selective/ — READY fingerprint stays unchanged.
    location = /client {
        return 301 /client/;
    }
    location /client/ {
        alias /var/spool/apt-mirror/client/;
        autoindex on;
        default_type text/plain;
        types {
            application/json json;
            application/x-sh sh;
            application/pgp-keys gpg;
            text/plain txt asc;
        }
    }

    # DP Phase 2 6.6.0 offline bundle (single final set; no generation dirs)
    location = /dp-phase2 {
        return 301 /dp-phase2/;
    }
    location = /dp-phase2/ {
        return 301 /dp-phase2/6.6.0/;
    }
    location = /dp-phase2/6.6.0 {
        return 301 /dp-phase2/6.6.0/;
    }
    location /dp-phase2/6.6.0/ {
        alias /var/spool/apt-mirror/dp-phase2/6.6.0/;
        autoindex on;
        default_type application/octet-stream;
        types {
            application/x-tar tar;
            application/gzip gz;
            application/vnd.debian.binary-package deb;
            application/x-sh sh;
            text/plain sha1 sha256 list env txt;
        }
    }

    # Block obvious path traversal probes (alias already confines paths)
    location ~ /\.\. {
        return 403;
    }

    access_log /var/log/nginx/apt-mirror-access.log;
    error_log /var/log/nginx/apt-mirror-error.log;
}

# Optional Host: archive.ubuntu.com (for /etc/hosts override; not required)
server {
    listen 80;
    listen [::]:80;
    server_name archive.ubuntu.com;

    root /var/spool/apt-mirror/selective;
    autoindex on;

    location = /ubuntu {
        return 301 /ubuntu/;
    }
    location /ubuntu/ {
        alias /var/spool/apt-mirror/selective/ubuntu/;
        autoindex on;
    }
    location /hops/ {
        alias /var/spool/apt-mirror/selective/hops/;
        autoindex on;
    }
    location ~ /\.\. {
        return 403;
    }

    access_log /var/log/nginx/apt-mirror-access.log;
    error_log /var/log/nginx/apt-mirror-error.log;
}

# Optional Host: security.ubuntu.com (same selective tree; no duplicate storage)
server {
    listen 80;
    listen [::]:80;
    server_name security.ubuntu.com;

    root /var/spool/apt-mirror/selective;
    autoindex on;

    location = /ubuntu {
        return 301 /ubuntu/;
    }
    location /ubuntu/ {
        alias /var/spool/apt-mirror/selective/ubuntu/;
        autoindex on;
    }
    location = /ubuntu-security {
        return 301 /ubuntu-security/;
    }
    location /ubuntu-security/ {
        alias /var/spool/apt-mirror/selective/ubuntu/;
        autoindex on;
    }
    location /hops/ {
        alias /var/spool/apt-mirror/selective/hops/;
        autoindex on;
    }
    location ~ /\.\. {
        return 403;
    }

    access_log /var/log/nginx/apt-mirror-access.log;
    error_log /var/log/nginx/apt-mirror-error.log;
}

# Optional Host: old-releases.ubuntu.com → same selective tree
server {
    listen 80;
    listen [::]:80;
    server_name old-releases.ubuntu.com;

    root /var/spool/apt-mirror/selective;
    autoindex on;

    location = /ubuntu {
